<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#252642"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="픽셀 파이터"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><title>픽셀 파이터</title><style>
:root{--ink:#24233b;--paper:#fff9e9;--gold:#f1bd4f;--red:#e95f59;--blue:#4a83b7;--green:#65a778}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:12px;background:#252642;color:var(--ink);font:16px system-ui,sans-serif}.wrap{max-width:760px;margin:auto}.brand{color:#ffe39a;font:10px monospace;line-height:1.7;margin-bottom:10px}.screen{background:var(--paper);border:4px solid #111127;box-shadow:6px 6px #111127;min-height:80vh;border-radius:4px;overflow:hidden}.head{padding:18px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}.pixel{font:bold 10px monospace;letter-spacing:.05em}.tag{background:var(--ink);color:white;padding:8px;font:10px monospace}.content{padding:20px}.title{font:bold 18px monospace;line-height:1.6;margin:4px 0 10px}.lead{line-height:1.6;color:#514956;margin:4px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice,.btn{font:inherit;border:3px solid var(--ink);background:white;padding:14px;color:var(--ink);text-align:left;box-shadow:3px 3px var(--ink);touch-action:manipulation;cursor:pointer;min-height:64px;border-radius:4px}.choice:hover,.btn:hover{background:#fff0bd}.choice strong{display:block;margin-bottom:5px}.choice span{font-size:14px;color:#776f70;line-height:1.45}.selected{background:#fff0bd}.btn{background:var(--gold);font-weight:bold;text-align:center;box-shadow:3px 3px var(--ink)}.input{display:block;width:100%;max-width:380px;min-height:52px;margin:8px 0 18px;padding:12px;font:18px system-ui;border:3px solid var(--ink);border-radius:4px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.stat{background:white;border:2px solid var(--ink);padding:8px}.stat small{display:block;color:#776f70}.stat b{display:block;margin:6px 0;font:12px monospace}.bar{height:7px;background:#e5ded0}.bar i{display:block;height:100%;background:var(--green)}.panel{padding:12px;background:#f3e8ce;border:2px dashed #817568;line-height:1.6;margin:14px 0}.pill{display:inline-block;background:#e7dbbf;padding:5px 8px;margin:3px;font-size:13px}.arena{position:relative;height:200px;overflow:hidden;border:3px solid var(--ink);margin:12px 0 18px;background:linear-gradient(#b4dff0 0 61%,#d8c095 61% 66%,#876b62 66%)}.crowd{position:absolute;bottom:64px;height:28px;width:100%;background:repeating-linear-gradient(90deg,#333250 0 8px,#e85d5c 8px 14px,#f2c45d 14px 20px,#628cad 20px 27px)}.ring{position:absolute;bottom:16px;left:8%;width:84%;height:78px;background:#f6ecd5;border:6px solid white;box-shadow:0 0 0 4px #d54d53;display:flex;justify-content:space-around;align-items:center}.fighter{position:relative;width:50px;height:66px}.fighter i{position:absolute;display:block;border:3px solid var(--ink)}.fighter .h{top:0;left:14px;width:22px;height:22px;background:#e5ae82}.fighter .b{top:22px;left:9px;width:32px;height:30px;background:#4b86ba}.fighter .l{top:50px;left:12px;width:26px;height:14px;background:#343450}.fighter.foe{transform:scaleX(-1)}.fighter.foe .b{background:#e75e59}.jolt{animation:jolt .3s linear}.swing{animation:swing .35s ease-out}.hit{animation:hit .3s ease-out}.float{position:absolute;left:45%;top:38%;font:bold 18px monospace;color:#fff;text-shadow:2px 2px #e95f59;animation:float .7s forwards;pointer-events:none}.log{background:#1f2036;color:#eff0dc;border:3px solid var(--ink);padding:12px;max-height:120px;overflow:auto;line-height:1.6}.log p{margin:2px}.result{text-align:center;background:#fff0bd;border:3px solid var(--ink);padding:14px;font:bold 20px monospace;line-height:1.8;margin:14px 0}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.muted{font-size:13px;color:#776f70}.busy .choice{pointer-events:none;opacity:.7}@keyframes jolt{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes swing{40%{transform:translateX(25px) rotate(-12deg)}75%{transform:translateX(5px)}}@keyframes hit{50%{transform:translateX(10px) rotate(8deg)}}@keyframes float{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}@media(max-width:620px){body{padding:calc(8px + env(safe-area-inset-top)) 8px calc(16px + env(safe-area-inset-bottom))}.screen{min-height:calc(100dvh - 54px);border-width:3px;box-shadow:4px 4px #111127}.head{padding:13px}.content{padding:14px}.title{font-size:14px}.grid{gap:8px}.choice{min-height:72px;padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.arena{height:180px}.footer{align-items:stretch;flex-direction:column}.btn{width:100%}}
</style></head><body><div class="wrap"><div class="brand">PIXEL FIGHTER<br>CAREER MODE</div><main id="app" class="screen"></main></div><script>
const app=document.querySelector('#app');let g={step:'create',name:'',build:'',s:{speed:4,power:4,stamina:4,guard:4,skill:4},fatigue:0,fame:0,w:0,l:0,week:0,log:[]};const labels={speed:'민첩',power:'힘',stamina:'체력',guard:'방어',skill:'기술'};function head(k,t,tag='첫 시즌'){return `<div class="head"><div><div class="pixel">${k}</div><h1 class="title">${t}</h1></div><div class="tag">${tag}</div></div>`}function stats(){return `<div class="stats">${Object.entries(g.s).map(([k,v])=>`<div class="stat"><small>${labels[k]}</small><b>${v}</b><div class="bar"><i style="width:${Math.min(v*9,100)}%"></i></div></div>`).join('')}</div>`}function status(){return `<span class="pill">피로 ${g.fatigue}</span><span class="pill">평판 ${g.fame}</span><span class="pill">전적 ${g.w}승 ${g.l}패</span>`}function render(){if(g.step==='create')create();if(g.step==='train')trainView();if(g.step==='event')eventView();if(g.step==='prep')prepView();if(g.step==='fight')fightView();if(g.step==='result')resultView();if(g.step==='end')endView()}function create(){app.innerHTML=head('CAREER MODE','나만의 파이터')+`<div class="content"><p class="lead">작은 체육관에서 첫 공식전을 향해 성장하세요.</p><b>선수 이름</b><input id="name" class="input" maxlength="10" placeholder="예: 한결" value="${g.name}"><b>성장 유형</b><div class="grid">${[['quick','스피드형','빠른 발과 회피','speed'],['tank','맷집형','버티며 기회를 기다림','guard'],['power','강타형','한 방의 위력','power'],['tech','기술형','정확한 타이밍과 연계','skill']].map(([id,n,d])=>`<button class="choice ${g.build===id?'selected':''}" onclick="pick('${id}')"><strong>${n}</strong><span>${d}</span></button>`).join('')}</div><div class="footer"><span class="muted">훈련과 경기로 스타일을 발전시키세요.</span><button class="btn" onclick="start()">커리어 시작 →</button></div></div>`}function pick(id){g.name=document.querySelector('#name')?.value||g.name;g.build=id;render()}function start(){g.name=document.querySelector('#name').value.trim();if(!g.name||!g.build){alert('이름과 성장 유형을 선택해 주세요.');return}let b={quick:['speed',2],tank:['stamina',1],power:['power',2],tech:['skill',2]}[g.build];g.s[b[0]]+=b[1];g.step='train';g.log.push(`${g.name} 선수, 첫 시즌 시작!`);render()}function trainView(){app.innerHTML=head(`시즌 1 · 훈련 ${g.week+1}/3`,'훈련을 선택하세요')+`<div class="content"><p class="lead">성장과 피로를 함께 관리해야 합니다.</p>${stats()}<div class="grid">${[['speed','풋워크 훈련','민첩 +1 · 피로 +1'],['power','미트 타격','힘 +1 · 피로 +1'],['stamina','체력 달리기','체력 +1 · 피로 +1'],['skill','기술 스파링','기술 +1 · 피로 +2'],['guard','방어 훈련','방어 +1 · 피로 +1'],['rest','회복과 스트레칭','피로 -2']].map(([k,n,d])=>`<button class="choice" onclick="train('${k}')"><strong>${n}</strong><span>${d}</span></button>`).join('')}</div><div class="panel">${status()}<br>훈련을 세 번 마치면 라이벌 이벤트가 열립니다.</div></div>`}function train(k){if(k==='rest')g.fatigue=Math.max(0,g.fatigue-2);else{g.s[k]++;g.fatigue+=k==='skill'?2:1}g.week++;g.log.push(k==='rest'?'회복에 집중했다.':`${labels[k]} 훈련으로 성장했다.`);g.step=g.week===3?'event':'train';render()}function arena(){return `<div class="arena" id="arena"><div class="crowd"></div><div class="ring"><div class="fighter" id="me"><i class="h"></i><i class="b"></i><i class="l"></i></div><b>VS</b><div class="fighter foe" id="foe"><i class="h"></i><i class="b"></i><i class="l"></i></div></div></div>`}function eventView(){app.innerHTML=head('경기 전날','라이벌의 도발','체육관')+`<div class="content">${arena()}<p class="lead">라이벌 도윤이 “아직 애송이”라고 말합니다. 어떻게 대응할까요?</p><div class="grid"><button class="choice" onclick="eventPick('clap')"><strong>맞받아친다</strong><span>평판을 얻지만 피로가 늘어납니다.</span></button><button class="choice" onclick="eventPick('ignore')"><strong>무시하고 집중한다</strong><span>피로를 낮추고 차분히 준비합니다.</span></button></div><div class="panel">${status()}</div></div>`}function eventPick(x){if(x==='clap'){g.fame+=2;g.fatigue++}else g.fatigue=Math.max(0,g.fatigue-1);g.step='prep';render()}function prepView(){app.innerHTML=head('경기 준비','상대 분석: 도윤','첫 공식전')+`<div class="content"><p class="lead">상대는 초반 압박이 강하고 후반에 지칩니다. 경기 계획을 정하세요.</p><div class="grid">${[['counter','거리 유지와 카운터','민첩·기술을 활용'],['guard','가드와 버티기','방어·체력으로 견딤'],['pressure','먼저 강하게 압박','힘으로 흐름을 가져옴'],['balanced','기본기에 집중','안정적인 경기 운영']].map(([k,n,d])=>`<button class="choice" onclick="prep('${k}')"><strong>${n}</strong><span>${d}</span></button>`).join('')}</div>${stats()}</div>`}function prep(k){g.plan=k;g.step='fight';g.round=1;g.hp=100;g.ehp=100;render()}function fightView(){app.innerHTML=head(`라운드 ${g.round}`,'첫 공식 경기','체력 0까지')+`<div class="content">${arena()}<div class="grid"><div class="stat"><small>${g.name} 체력</small><b>${Math.max(0,g.hp)}%</b><div class="bar"><i style="width:${g.hp}%;background:#4a83b7"></i></div></div><div class="stat"><small>도윤 체력</small><b>${Math.max(0,g.ehp)}%</b><div class="bar"><i style="width:${g.ehp}%;background:#e95f59"></i></div></div></div><div class="panel">${g.round%2?'상대가 거리를 좁혀옵니다.':'상대의 호흡이 거칠어집니다. 빈틈을 노리세요.'}</div><div class="grid">${[['attack','🥊 콤비네이션','기술로 연속 공격'],['dodge','💨 스텝 회피','민첩으로 피하고 반격'],['guard','🛡 가드와 버티기','피해를 줄입니다'],['heavy','💥 강한 한 방','힘을 실어 타격']].map(([k,n,d])=>`<button class="choice" onclick="turn('${k}')"><strong>${n}</strong><span>${d}</span></button>`).join('')}</div><div class="log">${g.log.slice(-4).map(x=>`<p>› ${x}</p>`).join('')}</div></div>`}function turn(a){if(g.busy)return;g.busy=true;app.classList.add('busy');let d=0,e=10+Math.random()*9,s=g.s;if(g.plan==='counter'&&(a==='dodge'||a==='attack'))d+=5;if(g.plan==='pressure'&&(a==='heavy'||a==='attack'))d+=5;if(g.plan==='guard'&&a==='guard')e-=6;let msg='';if(a==='attack'){d+=9+s.skill*1.4;e=Math.max(2,e-s.guard*.8);msg='콤비네이션 적중!'}else if(a==='heavy'){d+=13+s.power*2;e=Math.max(3,e-s.guard*.55);msg='강한 타격으로 몰아붙였다!'}else if(a==='dodge'){if(Math.random()<Math.min(.75,.25+s.speed*.045)){d+=7+s.skill;e=0;msg='회피 후 카운터 성공!'}else{e=Math.max(3,e-s.guard*.6);msg='회피가 늦어 공격을 허용했다.'}}else{e=Math.max(2,e*.25-s.guard*.45);msg='가드로 공격을 받아냈다.'}g.ehp-=Math.round(d);g.hp-=Math.round(e);g.log.push(msg);document.querySelector('#arena')?.classList.add('jolt');if(d>0){let f=document.createElement('b');f.className='float';f.textContent=`-${Math.round(d)} POW!`;document.querySelector('#arena')?.append(f)}if(e>0){let f=document.createElement('b');f.className='float';f.style.left='18%';f.textContent=`-${Math.round(e)}`;document.querySelector('#arena')?.append(f)}document.querySelector('#me')?.classList.add(a==='dodge'?'swing':'swing');document.querySelector('#foe')?.classList.add('hit');setTimeout(()=>{g.busy=false;app.classList.remove('busy');if(g.hp<=0||g.ehp<=0)finish();else{g.round++;render()}},600)}function finish(){g.win=g.ehp<=0;if(g.win){g.w++;g.fame+=3;g.log.push('상대 체력이 다해 승리했다!')}else{g.l++;g.log.push('체력이 먼저 다했다.')}g.step='result';render()}function resultView(){app.innerHTML=head('경기 결과',g.win?'첫 승리!':'아쉬운 패배','시즌 결산')+`<div class="content"><div class="result">${g.win?'VICTORY!':'NEXT TIME!'}<br><small>${g.w}승 ${g.l}패</small></div><p class="lead">${g.win?'첫 공식전에서 승리했습니다!':'패배에서 배울 점을 찾아 다음 경기를 준비하세요.'}</p><div class="panel">${g.log.slice(-3).map(x=>`<div>• ${x}</div>`).join('')}<br>${status()}</div><button class="btn" onclick="g.step='end';render()">시즌 결산 보기 →</button></div>`}function endView(){app.innerHTML=head('SEASON COMPLETE','첫 시즌 기록')+`<div class="content"><div class="result">${g.name}<br>${g.w}승 ${g.l}패<br>평판 ${g.fame}</div><p class="lead">첫 발을 내디뎠습니다. 더 큰 무대를 향할 시간이에요.</p><button class="btn" onclick="location.reload()">새 선수로 다시 시작</button></div>`}render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
